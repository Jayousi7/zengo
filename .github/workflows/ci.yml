name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:  # build the binaries and packages without releasing them

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu keeps the binary's glibc requirement low,
          # so it runs on more distributions.
          - os: ubuntu-22.04
            built: dist/zengo
            asset: zengo-linux-x86_64
          - os: windows-latest
            built: dist/zengo.exe
            asset: zengo-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libpulse0
      - run: pip install -e ".[dev]"
      - run: python scripts/build.py
      - name: Linux packages (.deb and AppImage)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          python scripts/package_linux.py --appimagetool ./appimagetool
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DVersion=$version" "/DSource=$pwd\dist\zengo.exe" packaging\windows\zengo.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: mv ${{ matrix.built }} ${{ matrix.asset }}
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            dist/*.deb
            dist/*.AppImage
            dist/*-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: ls -lR
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            zengo-linux-x86_64
            zengo-windows-x86_64.exe
            **/*.deb
            **/*.AppImage
            **/*-setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
